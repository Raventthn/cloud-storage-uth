version: '3.8'

services:
  backend:
    build: .
    container_name: cloud_backend_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/code/storage
    depends_on:
      - mongo_db

  mongo_db:
    image: mongo:latest
    container_name: cloud_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: