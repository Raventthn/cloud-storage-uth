server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index login.html;
  client_max_body_size 100m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health { proxy_pass http://backend:8000/health; }
  location / { try_files $uri $uri/ /login.html; }
}
